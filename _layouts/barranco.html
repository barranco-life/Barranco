<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'es' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.url == '/' %}{{ page.title }}{% else %}{{ page.title }} · Barranco{% endif %}</title>
    <meta name="description" content="{{ page.description | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="{{ page.og_locale | default: 'es_BO' }}">
    <meta property="og:title" content="{{ page.title | escape }}">
    <meta property="og:description" content="{{ page.description | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ page.og_image | default: '/assets/images/encuentros/encuentros-og-1200x630.jpg' | absolute_url }}">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="{{ '/assets/css/barranco.css' | relative_url }}">
    {% include head-custom.html %}
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="site-header__brand" href="{{ '/' | relative_url }}" aria-label="Barranco — inicio">
          <img src="{{ '/assets/images/barranco/logo-barranco-1200.png' | relative_url }}" alt="Barranco" width="1200" height="237">
        </a>
        <nav class="site-nav" aria-label="Principal">
          <a href="{{ '/' | relative_url }}#visita"{% if page.nav == 'visita' %} aria-current="page"{% endif %}>Visítanos</a>
          <a href="{{ '/galeria/' | relative_url }}"{% if page.nav == 'galeria' %} aria-current="page"{% endif %}>Galería</a>
          <a href="{{ '/encuentros/' | relative_url }}">Encuentros</a>
          <a href="{{ '/convocatorias/' | relative_url }}"{% if page.nav == 'convocatorias' %} aria-current="page"{% endif %}>Propón algo</a>
        </nav>
      </div>
    </header>

    <main class="site-main">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="wrap">
        <p><strong>Proyecto Cultural Barranco</strong> · Calle Las Tunas 224, Mallasa, La Paz · desde diciembre de 2020</p>
        <p>
          <a href="https://www.instagram.com/barranco.life/">Instagram</a> ·
          <a href="https://goo.gl/maps/iWB6R5HZnREL7ALKA">Mapa</a> ·
          <a href="{{ site.barranco_whatsapp }}">WhatsApp</a> ·
          <a href="https://voluntariado.barranco.life/">Voluntariado</a>
        </p>
      </div>
    </footer>
  </body>
</html>
